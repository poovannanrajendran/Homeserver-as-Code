name: paperclip-locallab

services:
  postgres:
    image: postgres:16-alpine
    container_name: paperclip-locallab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - paperclip_locallab_pgdata:/var/lib/postgresql/data

  paperclip:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PAPERCLIP_VERSION: ${PAPERCLIP_VERSION:-latest}
    image: paperclip-locallab:${PAPERCLIP_VERSION:-latest}
    container_name: paperclip-locallab
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PAPERCLIP_INSTANCE_ID: ${PAPERCLIP_INSTANCE_ID:-paperclip-locallab}
      PAPERCLIP_PORT: 3102
      DATABASE_URL: postgresql://${POSTGRES_USER:-paperclip}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-paperclip}
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3102}"
      PAPERCLIP_BRAND_COLOR: "${PAPERCLIP_BRAND_COLOR:-#0f766e}"
      PAPERCLIP_THEME_NAME: "${PAPERCLIP_THEME_NAME:-paperclip-locallab}"
      N8N_MCP_URL: "${N8N_MCP_URL:-http://192.168.1.20:5678/mcp-server/http}"
      LOCAL_MAC_MCP_URL: "${LOCAL_MAC_MCP_URL:-http://host.docker.internal:8765/mcp}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_OPENAI_BASE_URL: "${OLLAMA_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PAPERCLIP_HOST_PORT:-3102}:3102"
    volumes:
      - paperclip_locallab_home:/home/paperclip/.paperclip
      - ../../paperclip/poovi_papercompany:/companies/poovi_papercompany:ro
      - ${POOVI_GROUNDING_PACK_PATH:-/Users/poovannanrajendran/Documents/workarea/Poovi_GroudningPack}:/grounding/Poovi_GroundingPack:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3102/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  paperclip_locallab_pgdata:
  paperclip_locallab_home:
