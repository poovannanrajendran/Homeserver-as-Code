global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["obs-alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["obs-prometheus:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["obs-node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["obs-cadvisor:8080"]

  - job_name: postgres_local
    static_configs:
      - targets: ["obs-postgres-exporter-local:9187"]

  - job_name: blackbox_http
    scrape_interval: 24h
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://192.168.1.250:8006
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: obs-blackbox:9115
  - job_name: blackbox_tcp_infra
    scrape_interval: 1m
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 192.168.1.250:8006
          - 192.168.1.20:22
          - 192.168.1.24:22
          - 192.168.1.30:22
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: obs-blackbox:9115
