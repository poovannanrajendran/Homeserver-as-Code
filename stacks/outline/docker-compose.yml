services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    ports:
      # LAN + Tailscale access. Keep your router/firewall from exposing this to the public internet.
      - "${OUTLINE_BIND_IP:-0.0.0.0}:${OUTLINE_HTTP_PORT:-3010}:3000"
    volumes:
      - /srv/data/outline/storage:/var/lib/outline/data
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - /srv/data/outline/redis:/data
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-outline}
    volumes:
      - /srv/data/outline/postgres:/var/lib/postgresql/data
